# Wydanie Punctum (punkt 18, etap 3; macOS: punkt 31 D): instalator Windows
# i obraz .dmg na macOS budowane tutaj, nie na komputerze autora, z tagu
# vX.Y.Z na main (zasady: CLAUDE.md, "Galezie i wydania"). Wynik trafia do
# GitHub Releases razem z sumami SHA-256 i opisem z CHANGELOG.md.
# Proba budowy bez wydania (pliki tylko jako artefakty przebiegu):
# uruchomienie reczne (Actions > Wydanie > Run workflow) albo push na
# galaz proba-wydania* (dziala tez bez uprawnien do recznego uruchamiania).
name: Wydanie

on:
  push:
    tags: ["v*"]
    branches: ["proba-wydania*"]
  workflow_dispatch:

permissions:
  contents: write       # gh release create
  id-token: write       # poswiadczenie pochodzenia
  attestations: write

concurrency:
  group: wydanie-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # potrzebne do sprawdzenia, czy tag lezy na main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Srodowisko (.venv jak na komputerze autora - tego oczekuje testy.bat)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r tools\wymagania-kompilacji.txt

      - name: Tag = numer wersji i lezy na main
        if: github.ref_type == 'tag'
        run: |
          $wersja = .venv\Scripts\python -c "import punctum; print(punctum.__version__)"
          if ("v$wersja" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} nie zgadza sie z __version__ = $wersja"
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag ${{ github.ref_name }} nie lezy na main" }
          # Opis wydania od razu - brak sekcji w CHANGELOG.md zatrzymuje przebieg
          # przed kilkudziesiecioma minutami kompilacji.
          .venv\Scripts\python tools\opis_wydania.py $wersja opis.md
          if ($LASTEXITCODE -ne 0) { throw "Brak opisu wydania" }

      - name: Testy bez interfejsu
        shell: cmd
        run: tools\testy.bat --szybkie

      - name: Inno Setup
        # Kreator korzysta z wygladu Inno 6.7 (WizardStyle, tlo) - upgrade
        # instaluje albo podnosi wersje z obrazu maszyny.
        run: choco upgrade innosetup -y --no-progress

      - name: Pamiec podreczna Nuitki
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ hashFiles('tools/wymagania-kompilacji.txt') }}-${{ github.sha }}
          restore-keys: nuitka-${{ hashFiles('tools/wymagania-kompilacji.txt') }}-

      - name: Kompilacja
        run: .venv\Scripts\python tools\kompiluj.py "${{ github.workspace }}\kompilacja"

      - name: Instalator i sumy SHA-256
        run: |
          .venv\Scripts\python tools\instalator.py "${{ github.workspace }}\kompilacja"
          if ($LASTEXITCODE -ne 0) { throw "Instalator nie powstal" }
          Set-Location kompilacja
          Get-FileHash Punctum-*-setup.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Out-File SHA256SUMS-windows.txt -Encoding ascii
          Get-Content SHA256SUMS-windows.txt

      - name: Poswiadczenie pochodzenia
        # W repozytorium prywatnym moze wymagac wyzszego planu GitHuba -
        # brak poswiadczenia nie blokuje wydania.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: kompilacja/Punctum-*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Punctum-windows
          path: kompilacja/Punctum-*-setup.exe
          retention-days: 14

  macos:
    # Apple Silicon. Paczka podpisana ad hoc (bez Developer ID - etap 31 E):
    # pierwsze uruchomienie wymaga "Otworz mimo to" w Ustawieniach systemowych.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Srodowisko
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tools/wymagania-kompilacji.txt

      - name: Testy bez interfejsu
        env:
          QT_QPA_PLATFORM: offscreen
        run: tools/testy.sh --szybkie

      - name: Pamiec podreczna Nuitki
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-${{ hashFiles('tools/wymagania-kompilacji.txt') }}-${{ github.sha }}
          restore-keys: nuitka-macos-${{ hashFiles('tools/wymagania-kompilacji.txt') }}-

      - name: Kompilacja (Punctum.app)
        run: .venv/bin/python tools/kompiluj.py "$GITHUB_WORKSPACE/kompilacja"

      - name: Proba startu (mostek MCP i program offscreen)
        run: .venv/bin/python tools/proba_paczki.py "$GITHUB_WORKSPACE/kompilacja"

      - name: Obraz .dmg
        run: .venv/bin/python tools/dmg.py "$GITHUB_WORKSPACE/kompilacja"

      - name: Poswiadczenie pochodzenia
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: kompilacja/Punctum-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Punctum-macos
          path: kompilacja/Punctum-*.dmg
          retention-days: 14

  wydanie:
    # Po obu budowach. Paczka na Maca nie przeszla jeszcze proby na
    # prawdziwym komputerze (31 C), wiec jej porazka nie wstrzymuje wydania
    # dla Windows - wychodzi wtedy sam instalator.
    needs: [windows, macos]
    if: always() && github.ref_type == 'tag' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: pliki
          merge-multiple: true

      - name: Sumy SHA-256 i GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wersja="${GITHUB_REF_NAME#v}"
          python3 tools/opis_wydania.py "$wersja" opis.md
          cd pliki
          sha256sum Punctum-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" Punctum-* SHA256SUMS.txt \
            --title "Punctum $wersja" --notes-file ../opis.md --verify-tag
